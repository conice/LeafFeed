name: "Build Commit"
on:
    push:
        branches:
            - main
        tags:
            - "v*"

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
    quality:
        name: Test and lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              env:
                  GIT_CONFIG_COUNT: 1
                  GIT_CONFIG_KEY_0: init.defaultBranch
                  GIT_CONFIG_VALUE_0: main
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v5
            - name: Run unit tests and lint
              run: sh ./gradlew testGithubDebugUnitTest lintGithubDebug --build-cache

            - name: Upload lint report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: LeafFeed-Lint-GitHub-Debug-${{ github.sha }}
                  path: |
                      app/build/reports/lint-results-githubDebug.*
                      app/build/intermediates/lint_intermediate_text_report/githubDebug/lintReportGithubDebug/lint-results-githubDebug.txt
                  if-no-files-found: warn

    build:
        name: Build APK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              env:
                  GIT_CONFIG_COUNT: 1
                  GIT_CONFIG_KEY_0: init.defaultBranch
                  GIT_CONFIG_VALUE_0: main
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v5
            - name: Select build type
              id: build_type
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              shell: bash
              run: |
                  if [[ -n "$ANDROID_KEYSTORE_BASE64" &&
                        -n "$ANDROID_KEYSTORE_PASSWORD" &&
                        -n "$ANDROID_KEY_ALIAS" &&
                        -n "$ANDROID_KEY_PASSWORD" ]]; then
                      echo "variant=release" >> "$GITHUB_OUTPUT"
                  else
                      echo "variant=debug" >> "$GITHUB_OUTPUT"
                      echo "::notice::Release signing secrets are incomplete; building a debug APK."
                  fi

            - name: Verify release tag matches the app version
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ "$GITHUB_REF" != refs/tags/* ]]; then
                      exit 0
                  fi
                  expected_version="${GITHUB_REF_NAME#v}"
                  actual_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
                  if [[ -z "$actual_version" || "$actual_version" != "$expected_version" ]]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match app version $actual_version"
                      exit 1
                  fi

            # Release artifacts use one persistent certificate so consecutive APKs remain
            # update-compatible.
            - name: Configure stable signing
              if: steps.build_type.outputs.variant == 'release'
              env:
                  LEAFFEED_SIGNING_STORE_FILE: ${{ runner.temp }}/leaffeed-release.keystore
                  LEAFFEED_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  LEAFFEED_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  LEAFFEED_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  for variable in ANDROID_KEYSTORE_BASE64 LEAFFEED_SIGNING_STORE_PASSWORD LEAFFEED_SIGNING_KEY_ALIAS LEAFFEED_SIGNING_KEY_PASSWORD; do
                      if [ -z "${!variable:-}" ]; then
                          echo "::error::Missing required secret for stable artifact signing: ${variable}"
                          exit 1
                      fi
                  done
                  if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" \
                      | tr -d '[:space:]' \
                      | base64 --decode > "$LEAFFEED_SIGNING_STORE_FILE"; then
                      echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Encode release-key.jks itself, without quotes, a data-URI prefix, a filename, or terminal prompt text."
                      exit 1
                  fi
                  if [ ! -s "$LEAFFEED_SIGNING_STORE_FILE" ]; then
                      echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
                      exit 1
                  fi
                  chmod 600 "$LEAFFEED_SIGNING_STORE_FILE"
                  if ! keytool -list -keystore "$LEAFFEED_SIGNING_STORE_FILE" \
                      -storepass "$LEAFFEED_SIGNING_STORE_PASSWORD" \
                      -alias "$LEAFFEED_SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
                      echo "::error::The decoded keystore, password, or key alias is invalid."
                      exit 1
                  fi

            - name: Assemble signed GitHub release
              if: steps.build_type.outputs.variant == 'release'
              env:
                  LEAFFEED_SIGNING_STORE_FILE: ${{ runner.temp }}/leaffeed-release.keystore
                  LEAFFEED_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  LEAFFEED_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  LEAFFEED_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  LEAFFEED_VERSION_CODE: ${{ github.run_number }}
              run: sh ./gradlew assembleGithubRelease --build-cache

            - name: Assemble GitHub debug
              if: steps.build_type.outputs.variant == 'debug'
              run: sh ./gradlew assembleGithubDebug --build-cache

            - uses: actions/upload-artifact@v6
              with:
                  name: LeafFeed-GitHub-Build-${{ github.sha }}
                  path: app/build/outputs/apk/github/${{ steps.build_type.outputs.variant }}/*.apk
                  if-no-files-found: error

    publish:
        if: startsWith(github.ref, 'refs/tags/')
        needs:
            - quality
            - build
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: write
        steps:
            - uses: actions/download-artifact@v6
              with:
                  name: LeafFeed-GitHub-Build-${{ github.sha }}
                  path: release-artifact
            - name: Publish GitHub release
              env:
                  GH_REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    release-artifact/*.apk \
                    --verify-tag \
                    --title "$TAG_NAME" \
                    --generate-notes
