name: "Build Commit"
on:
    push:
        branches:
            - main
        tags:
            - "v*"

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
    quality:
        name: Test and lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              env:
                  GIT_CONFIG_COUNT: 1
                  GIT_CONFIG_KEY_0: init.defaultBranch
                  GIT_CONFIG_VALUE_0: main
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v5
            - name: Run unit tests
              run: sh ./gradlew testGithubDebugUnitTest --build-cache

            # Lint was added after the project already had a backlog, so keep the report visible
            # without allowing it to block creation of the signed APK.
            - name: Lint GitHub debug
              continue-on-error: true
              run: sh ./gradlew lintGithubDebug --build-cache

            - name: Upload lint report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: LeafFeed-Lint-GitHub-Debug-${{ github.sha }}
                  path: |
                      app/build/reports/lint-results-githubDebug.*
                      app/build/intermediates/lint_intermediate_text_report/githubDebug/lintReportGithubDebug/lint-results-githubDebug.txt
                  if-no-files-found: warn

    build:
        name: Build signed APK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              env:
                  GIT_CONFIG_COUNT: 1
                  GIT_CONFIG_KEY_0: init.defaultBranch
                  GIT_CONFIG_VALUE_0: main
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v5
            - name: Verify release tag matches the app version
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ "$GITHUB_REF" != refs/tags/* ]]; then
                      exit 0
                  fi
                  expected_version="${GITHUB_REF_NAME#v}"
                  actual_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
                  if [[ -z "$actual_version" || "$actual_version" != "$expected_version" ]]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match app version $actual_version"
                      exit 1
                  fi

            # Downloadable push artifacts must use one persistent certificate. GitHub-hosted
            # runners generate a different default debug keystore on every run, which makes
            # consecutive APKs update-incompatible.
            - name: Configure stable signing
              env:
                  LEAFFEED_SIGNING_STORE_FILE: ${{ runner.temp }}/leaffeed-release.keystore
                  LEAFFEED_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  LEAFFEED_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  LEAFFEED_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  for variable in ANDROID_KEYSTORE_BASE64 LEAFFEED_SIGNING_STORE_PASSWORD LEAFFEED_SIGNING_KEY_ALIAS LEAFFEED_SIGNING_KEY_PASSWORD; do
                      if [ -z "${!variable:-}" ]; then
                          echo "::error::Missing required secret for stable artifact signing: ${variable}"
                          exit 1
                      fi
                  done
                  if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" \
                      | tr -d '[:space:]' \
                      | base64 --decode > "$LEAFFEED_SIGNING_STORE_FILE"; then
                      echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Encode release-key.jks itself, without quotes, a data-URI prefix, a filename, or terminal prompt text."
                      exit 1
                  fi
                  if [ ! -s "$LEAFFEED_SIGNING_STORE_FILE" ]; then
                      echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
                      exit 1
                  fi
                  chmod 600 "$LEAFFEED_SIGNING_STORE_FILE"
                  if ! keytool -list -keystore "$LEAFFEED_SIGNING_STORE_FILE" \
                      -storepass "$LEAFFEED_SIGNING_STORE_PASSWORD" \
                      -alias "$LEAFFEED_SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
                      echo "::error::The decoded keystore, password, or key alias is invalid."
                      exit 1
                  fi

            - name: Assemble signed GitHub APK
              env:
                  LEAFFEED_SIGNING_STORE_FILE: ${{ runner.temp }}/leaffeed-release.keystore
                  LEAFFEED_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  LEAFFEED_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  LEAFFEED_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  LEAFFEED_VERSION_CODE: ${{ github.run_number }}
              run: sh ./gradlew assembleGithubRelease --build-cache

            - uses: actions/upload-artifact@v6
              with:
                  name: LeafFeed-GitHub-Build-${{ github.sha }}
                  path: app/build/outputs/apk/github/release/*.apk
                  if-no-files-found: error

    publish:
        if: startsWith(github.ref, 'refs/tags/')
        needs:
            - quality
            - build
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: write
        steps:
            - uses: actions/download-artifact@v6
              with:
                  name: LeafFeed-GitHub-Build-${{ github.sha }}
                  path: release-artifact
            - name: Publish GitHub release
              env:
                  GH_REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    release-artifact/*.apk \
                    --verify-tag \
                    --title "$TAG_NAME" \
                    --generate-notes
