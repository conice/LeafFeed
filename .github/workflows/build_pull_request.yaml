name: "Build Pull Request"
on: pull_request

permissions:
    contents: read

concurrency:
    group: build-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              env:
                  GIT_CONFIG_COUNT: 1
                  GIT_CONFIG_KEY_0: init.defaultBranch
                  GIT_CONFIG_VALUE_0: main
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v5
            - name: Test, lint, and assemble all distribution channels
              run: >-
                  sh ./gradlew
                  testGithubDebugUnitTest
                  lintGithubDebug
                  lintFdroidDebug
                  lintGooglePlayDebug
                  assembleGithubDebug
                  assembleFdroidDebug
                  assembleGooglePlayDebug
                  --build-cache

            - uses: actions/upload-artifact@v5
              with:
                  name: github-${{ github.sha }}
                  path: app/build/outputs/apk/github/debug/*.apk
                  if-no-files-found: error
