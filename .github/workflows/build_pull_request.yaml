name: "Build Pull Request"
on: pull_request

permissions:
    contents: read

concurrency:
    group: build-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    quality:
        name: Test and lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              env:
                  GIT_CONFIG_COUNT: 1
                  GIT_CONFIG_KEY_0: init.defaultBranch
                  GIT_CONFIG_VALUE_0: main
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v5
            - name: Run unit tests and lint
              run: sh ./gradlew testGithubDebugUnitTest lintGithubDebug --build-cache

            - name: Upload lint report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: LeafFeed-Lint-GitHub-Debug-${{ github.sha }}
                  path: |
                      app/build/reports/lint-results-githubDebug.*
                      app/build/intermediates/lint_intermediate_text_report/githubDebug/lintReportGithubDebug/lint-results-githubDebug.txt
                  if-no-files-found: warn

    build:
        name: Build debug APK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              env:
                  GIT_CONFIG_COUNT: 1
                  GIT_CONFIG_KEY_0: init.defaultBranch
                  GIT_CONFIG_VALUE_0: main
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v5
            - name: Assemble GitHub debug
              run: sh ./gradlew assembleGithubDebug --build-cache

            - uses: actions/upload-artifact@v6
              with:
                  name: github-${{ github.sha }}
                  path: app/build/outputs/apk/github/debug/*.apk
                  if-no-files-found: error
