name: "Build Pull Request"
on: pull_request

permissions:
    contents: read

concurrency:
    group: build-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              env:
                  GIT_CONFIG_COUNT: 1
                  GIT_CONFIG_KEY_0: init.defaultBranch
                  GIT_CONFIG_VALUE_0: main
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v5
            - name: Run unit tests
              run: sh ./gradlew testGithubDebugUnitTest --build-cache

            # Product flavors share all Kotlin/Java sources. Keep the existing lint backlog visible
            # without allowing it to prevent creation of the GitHub debug artifact.
            - name: Lint GitHub debug
              continue-on-error: true
              run: sh ./gradlew lintGithubDebug --build-cache

            - name: Upload lint report
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: LeafFeed-Lint-GitHub-Debug-${{ github.sha }}
                  path: |
                      app/build/reports/lint-results-githubDebug.*
                      app/build/intermediates/lint_intermediate_text_report/githubDebug/lintReportGithubDebug/lint-results-githubDebug.txt
                  if-no-files-found: warn

            - name: Assemble GitHub debug
              run: sh ./gradlew assembleGithubDebug --build-cache

            - uses: actions/upload-artifact@v5
              with:
                  name: github-${{ github.sha }}
                  path: app/build/outputs/apk/github/debug/*.apk
                  if-no-files-found: error
